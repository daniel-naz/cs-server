<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class website</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <main>
        <h1>Class website</h1>
        <p>Edit this page in <code>website/index.html</code>.</p>

        <section>
            <h2>Add a student</h2>
            <form action="/add-student" method="post">
                <label for="name">Name</label>
                <input id="name" name="name" maxlength="80" required>

                <label for="age">Age</label>
                <input id="age" name="age" type="number" min="1" max="120" required>

                <button type="submit">Save to SQLite</button>
            </form>
            <p><a href="/students">View students</a></p>
        </section>

        <section>
            <h2>Try a GET request</h2>
            <form action="/hello" method="get">
                <label for="helloName">Your name</label>
                <input id="helloName" name="name" value="Daniel">
                <button type="submit">Say hello</button>
            </form>
        </section>

        <section>
            <h2>JavaScript</h2>
            <button id="jsButton" type="button">Test JavaScript</button>
            <p id="jsResult" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
